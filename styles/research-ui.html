<script>
document.addEventListener('DOMContentLoaded', () => {
  if (document.body.classList.contains('paper-article')) {
    const stylesheet = document.querySelector('link[href*="styles/research.css"]');
    if (stylesheet) import(new URL('paper-comments.js', stylesheet.href).href)
      .then(module => module.mountComments()).catch(() => {});
  }
  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  let storedMotion = 'on';
  try { storedMotion = localStorage.getItem('paper-motion') || 'on'; } catch {}
  let motionEnabled = false;
  let revealsInitialized = false;
  const motionButton = document.getElementById('motion-toggle');
  function syncMotion() {
    motionEnabled = !motionPreference.matches && storedMotion !== 'off';
    document.body.classList.toggle('motion-ready', motionEnabled);
    document.body.classList.toggle('motion-paused', !motionEnabled);
    if (motionButton) {
      motionButton.hidden = false;
      motionButton.textContent = motionEnabled ? '모션 켜짐 Ⅱ' : '모션 꺼짐 ▶';
      motionButton.setAttribute('aria-pressed', String(motionEnabled));
    }
    initializeReveals();
  }
  syncMotion();
  motionPreference.addEventListener?.('change', syncMotion);
  if (motionButton) motionButton.addEventListener('click', () => {
    storedMotion = motionEnabled ? 'off' : 'on';
    try { localStorage.setItem('paper-motion', storedMotion); } catch {}
    syncMotion();
  });
  function initializeReveals() {
    if (!motionEnabled || revealsInitialized || !('IntersectionObserver' in window)) return;
    revealsInitialized = true;
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); } });
    }, {threshold: .07});
    document.querySelectorAll('.paper-card,.archive-heading,.principles-intro,.principle,.research-outro').forEach((element, index) => { element.style.setProperty('--reveal-delay', `${Math.min(index % 3 * 160, 320)}ms`); element.classList.add('will-reveal'); observer.observe(element); });
    document.addEventListener('focusin', event => event.target.closest?.('.will-reveal')?.classList.add('is-visible'));
  }
  const art = document.querySelector('.awards-hero .hero-art');
  if (art && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    let pointerFrame = 0;
    art.addEventListener('pointermove', event => {
      if (!motionEnabled) return;
      const box = art.getBoundingClientRect();
      const x = (event.clientX - box.left) / box.width - .5;
      const y = (event.clientY - box.top) / box.height - .5;
      cancelAnimationFrame(pointerFrame);
      pointerFrame = requestAnimationFrame(() => {
        art.style.setProperty('--tilt-x', `${-y * 6}deg`);
        art.style.setProperty('--tilt-y', `${x * 8}deg`);
      });
    });
    art.addEventListener('pointerleave', () => { cancelAnimationFrame(pointerFrame); art.style.setProperty('--tilt-x', '0deg'); art.style.setProperty('--tilt-y', '0deg'); });
    let scrollFrame = 0;
    const updateArt = () => { scrollFrame = 0; if (motionEnabled) art.style.setProperty('--scroll-shift', `${Math.min(scrollY * .065, 38)}px`); };
    addEventListener('scroll', () => { if (!scrollFrame) scrollFrame = requestAnimationFrame(updateArt); }, {passive: true});
    updateArt();
  }
  const search = document.getElementById('paper-search');
  if (search) search.addEventListener('input', () => {
    const terms = search.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    let visible = 0;
    document.querySelectorAll('.paper-card').forEach(card => {
      card.hidden = !terms.every(term => (card.dataset.search || '').includes(term));
      if (!card.hidden) visible++;
    });
    const empty = document.getElementById('paper-search-empty');
    if (empty) empty.hidden = visible > 0 || !terms.length;
  });
  if (document.body.classList.contains('paper-article')) {
    const progress = document.createElement('div'); progress.className = 'reading-progress'; progress.setAttribute('aria-hidden', 'true');
    const bar = document.createElement('span'); progress.append(bar); document.body.append(progress);
    const updateProgress = () => { const max = document.documentElement.scrollHeight - innerHeight; bar.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%'; };
    addEventListener('scroll', updateProgress, {passive: true}); updateProgress();
    const header = document.getElementById('title-block-header');
    if (header) {
      const trail = document.createElement('div'); trail.className = 'article-eyebrow';
      const link = document.createElement('a'); link.href = '../../index.html'; link.textContent = 'PAPER NOTES';
      trail.append(link, document.createTextNode(' / READING THE INTERNALS')); header.prepend(trail);
    }
    document.querySelectorAll('h2').forEach(heading => {
      if (heading.textContent.includes('논문과 구현 정보')) {
        const table = heading.parentElement?.querySelector('table'); if (table) table.classList.add('paper-facts');
      }
    });
  }
});
</script>
